<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VENDIX AI</title>
<style>
body{background:#0b111e;color:white;font-family:Inter,sans-serif;margin:0}
.header{padding:12px 20px;display:flex;justify-content:space-between;background:#111a2b;border-bottom:1px solid #1e2a44}
.main{display:grid;grid-template-columns:320px 1fr 340px;gap:16px;padding:16px;height:calc(100vh - 60px)}
.card{background:#111a2b;border:1px solid #1e2a44;border-radius:12px;padding:16px;overflow:auto}
input,select{width:100%;background:#0b111e;border:1px solid #2a3a5c;color:#fff;padding:8px;border-radius:6px;margin:6px 0}
.circle-wrap{width:180px;height:180px;margin:30px auto;position:relative}
.circle{width:100%;height:100%;border-radius:50%;border:8px solid #1e2a44;border-top-color:#ff6b6b;display:flex;align-items:center;justify-content:center;flex-direction:column}
.score{font-size:36px;font-weight:800;line-height:1}
.label{font-size:12px;opacity:0.7;margin-top:4px;word-break:normal;white-space:normal;text-align:center}
.btn{width:100%;padding:10px;border:none;border-radius:8px;cursor:pointer;font-weight:600;margin-top:8px}
.btn-blue{background:#2f6bff;color:white}
.btn-yellow{background:#ffcc00;color:#000}
.btn-dark{background:#1e2a44;color:white}
.flag{padding:6px 10px;background:#1a233a;border-radius:6px;margin:4px 0;font-size:13px;border-left:3px solid #ff6b6b}
.hash{font-family:monospace;font-size:10px;word-break:break-all;background:#0b111e;padding:8px;border-radius:6px}
</style>
</head>
<body>
<div class="header"><b>VENDIX AI</b><span style="color:#2ecc71;font-size:12px">● Live • System Online | ENV: Production</span></div>
<div class="main">
  <div class="card">
    <b>Vendor Intake Queue</b>
    <input id="vendor" value="Apex Cloud Analytics">
    <input id="amount" type="number" value="120000">
    <input id="net" type="number" value="60">
    <label><input type="checkbox" id="soc2"> SOC2 Compliant</label>
    <label><input type="checkbox" id="iso" checked> ISO27001</label>
    <label><input type="checkbox" id="dataRes" checked> Data Residency FAIL (EU)</label>
    <label><input type="checkbox" id="cve" checked> Open CVE Detected</label>
    <button class="btn btn-blue" onclick="run()">Run Governance Pipeline</button>
    <div id="queue" style="margin-top:16px"></div>
  </div>
  <div class="card" style="text-align:center">
    <b style="float:left">AI Risk Reasoning</b>
    <div style="clear:both"></div>
    <div class="circle-wrap"><div class="circle" id="circle"><div class="score" id="score">--</div><div class="label">RISK SCORE /100</div></div></div>
    <div style="text-align:left"><small id="rules">Policy Rules Evaluated: 0/12</small><div id="flags"></div></div>
  </div>
  <div class="card">
    <b>Approval Console</b>
    <div id="status" style="background:#3a1f1f;color:#ff8a8a;padding:4px 8px;border-radius:4px;font-size:12px;display:inline-block;margin:8px 0">PENDING APPROVAL</div>
    <button class="btn btn-yellow" onclick="override()">🧑‍💼 Human Override</button>
    <button class="btn btn-dark" onclick="requestInfo()">Request Additional Info</button>
    <p style="margin-top:16px"><b>Audit & Provenance</b></p>
    <div class="hash" id="auditHash">--</div>
    <p><b>Analytics Telemetry</b></p>
    <div class="hash" id="telemetry">--</div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-dark" style="background:#3a1f1f" onclick="reject()">Reject & Escalate</button><button class="btn btn-dark" style="background:#1f3a25" onclick="approve()">Approve with Conditions</button></div>
  </div>
</div>
<script>
let lastResult=null;
async function run(){
  const payload={vendor_name:document.getElementById('vendor').value, contract_value:parseInt(document.getElementById('amount').value), net_terms:parseInt(document.getElementById('net').value), soc2:document.getElementById('soc2').checked, iso27001:document.getElementById('iso').checked, data_residency_fail:document.getElementById('dataRes').checked, open_cve:document.getElementById('cve').checked};
  const res=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const data=await res.json(); lastResult=data;
  document.getElementById('score').innerText=data.risk_assessment.score;
  document.getElementById('rules').innerText=`Policy Rules Evaluated: ${data.security_integrity.rules_evaluated}/12`;
  document.getElementById('flags').innerHTML=data.risk_assessment.flags.map(f=>`<div class="flag">⚠️ ${f}</div>`).join('');
  document.getElementById('status').innerText=data.approval_status; document.getElementById('status').style.background=data.risk_assessment.level==='HIGH'?'#3a1f1f':'#1f3a25';
  document.getElementById('auditHash').innerText=data.security_integrity.audit_hash_sha256;
  document.getElementById('telemetry').innerText=`Latency: ${data.analytics_telemetry.latency_ms}ms | Rules: ${data.analytics_telemetry.rules_engine_version} | Auth: ${data.security_integrity.integrity_status}`;
  document.getElementById('circle').style.borderTopColor=data.risk_assessment.level==='HIGH'?'#ff6b6b':data.risk_assessment.level==='MEDIUM'?'#ffcc00':'#2ecc71';
}
async function override(){
  if(!lastResult) return alert('Pehle Run Governance karo');
  const res=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({human_override:true})});
  const data=await res.json();
  document.getElementById('status').innerText='APPROVED (Human Override)'; document.getElementById('status').style.background='#1f3a25';
}
function requestInfo(){alert('Info requested - vendor ko email gaya! (Demo)')}
function reject(){document.getElementById('status').innerText='REJECTED & ESCALATED'}
function approve(){document.getElementById('status').innerText='APPROVED WITH CONDITIONS'}
</script>
</body>
</html>
